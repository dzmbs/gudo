# Self-hosted iroh relay on a VPS (docs/RELAYS.md). Pin the image to the iroh version the app
# and daemon are built with (Cargo.toml: iroh = "1.3.0"); relay and client versions must stay
# compatible. Put the access token in `.env` next to this file (never in git):
#
#   echo "IROH_RELAY_ACCESS_TOKEN=$(openssl rand -base64 32)" > .env && chmod 600 .env
services:
  # Hands the certificate volume to the unprivileged relay user, then exits.
  relay-data-owner:
    image: busybox:1.37.0
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - relay-data:/data
    network_mode: none
    restart: "no"

  iroh-relay:
    image: n0computer/iroh-relay:v1.3.0
    command: ["--config-path", "/etc/iroh-relay.toml"]
    restart: unless-stopped
    depends_on:
      relay-data-owner:
        condition: service_completed_successfully
    ports:
      - "80:80/tcp"      # ACME HTTP-01 challenge and captive-portal checks
      - "443:443/tcp"    # the relay (HTTPS / WebSocket)
      - "7842:7842/udp"  # QUIC address discovery
    environment:
      # Refuses to start without a token: an open relay is a free proxy for anyone.
      IROH_RELAY_ACCESS_TOKEN: ${IROH_RELAY_ACCESS_TOKEN:?set IROH_RELAY_ACCESS_TOKEN in .env}
    volumes:
      - ./iroh-relay.toml:/etc/iroh-relay.toml:ro
      - relay-data:/data
    # Unprivileged, no capabilities, nothing writable but the certificate volume.
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Health: `curl -fsS https://relay.example.com/healthz` from outside (monitor this).

volumes:
  relay-data:
