# Self-hosted iroh relay (docs/RELAYS.md). Copy next to docker-compose.yml, set the hostname
# and contact, put the token in `.env`, then `docker compose up -d`.

enable_relay = true
http_bind_addr = "[::]:80"
# QUIC address discovery (UDP 7842): lets peers learn their public address for hole punching.
enable_quic_addr_discovery = true
# Prometheus metrics, on the container's loopback only: never publish this port.
enable_metrics = true
metrics_bind_addr = "127.0.0.1:9090"

# Only devices and daemons that know the token may relay. Put the same token in the daemon's
# config.toml ([relay] auth_token); pairing tickets carry it to the app.
# IROH_RELAY_ACCESS_TOKEN (required by docker-compose.yml) replaces this placeholder; without
# Docker, replace it with `openssl rand -base64 32`.
access.shared_token = ["REPLACE-WITH-A-RANDOM-TOKEN"]

[tls]
cert_mode = "LetsEncrypt"
hostname = "relay.example.com"
contact = "admin@example.com"
cert_dir = "/data/certs"
prod_tls = true
https_bind_addr = "[::]:443"
quic_bind_addr = "[::]:7842"

# New connections: 100 a second, bursts of 200.
[limits]
accept_conn_limit = 100.0
accept_conn_burst = 200

# Per client: 10 MiB/s sustained, 20 MiB bursts.
[limits.client.rx]
bytes_per_second = 10485760
max_burst_bytes = 20971520
