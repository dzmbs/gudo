[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
brand = { path = "crates/brand" }
ghostty-vt = { path = "crates/ghostty-vt" }
ghostty-vt-sys = { path = "crates/ghostty-vt-sys" }
agents = { path = "crates/agents" }
proto = { path = "crates/proto" }
grants = { path = "crates/grants" }
pty = { path = "crates/pty" }
daemon = { path = "crates/daemon" }
client-core = { path = "crates/client-core" }
ssh = { path = "crates/ssh" }
push = { path = "crates/push" }
drawing = { path = "crates/drawing" }

base64 = "0.23"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
regex = "1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1"
toml = "1"
bytes = "1.12"
# Pinned: libc 0.2.190+ declares `in6_ifreq` for macOS only, and netdev 0.46 (iroh → netwatch)
# uses it on every Darwin target, so iOS stops compiling. Lift once netdev adapts.
libc = "=0.2.189"
proptest = "1"
rustix = { version = "1", features = ["event", "fs", "pipe", "process", "pty", "termios"] }
thiserror = "2"
tracing = "0.1.44"
data-encoding = "2.11.1"
getrandom = "0.4.3"
zstd = { version = "0.14.3", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
notify = "8"

# Apple FFI (crates/apple-ffi): proc-macro UniFFI, no UDL. xtask generates the Swift bindings
# with uniffi_bindgen's library mode, so the app build never runs a Rust binary.
uniffi = { version = "0.32.2", default-features = false }
uniffi_bindgen = "0.32.2"
camino = "1"

# iroh per 07 §7: no default features; ring as the single TLS provider; the Apple fast
# datapath because iOS/macOS are the targets.
anyhow = "1.0.104"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

# SSH (crates/ssh, D7): russh on ring, the crypto provider iroh already uses (no aws-lc). RSA for
# imported keys, flate2 for `zlib@openssh.com` and gzip-compressed uploads.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
ring = "0.17.14"
flate2 = "1"
# Push (crates/push, docs/PUSH.md): HPKE's X25519 from curve25519-dalek and Ed25519 from
# ed25519-dalek (both already in the graph through iroh), HKDF and ChaCha20-Poly1305 from ring;
# HTTP to the push relay with reqwest on rustls/ring (already in the graph through iroh-relay).
curve25519-dalek = { version = "5", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
# Tests only: a local iroh-relay for the self-hosted relay tests.
iroh-relay = { version = "1.3.0", default-features = false, features = ["server", "test-utils", "tls-ring"] }

# Tests only: a software P-256 key standing in for the Secure Enclave.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# profile's whole cache, so treat these as settled.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.build-override]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
debug = "line-tables-only"
lto = "thin"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
