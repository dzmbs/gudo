[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
brand = { path = "crates/brand" }
ghostty-vt = { path = "crates/ghostty-vt" }
ghostty-vt-sys = { path = "crates/ghostty-vt-sys" }
agents = { path = "crates/agents" }
proto = { path = "crates/proto" }

base64 = "0.23"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
regex = "1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1"
toml = "1"

# single TLS provider; the Apple fast datapath because iOS/macOS are the targets.
anyhow = "1.0.104"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# profile's whole cache, so treat these as settled.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.build-override]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
debug = "line-tables-only"
lto = "thin"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
