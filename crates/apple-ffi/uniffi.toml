# Swift names for the generated bindings (crates/apple-ffi → apple/Packages/UnnamedCore).
# Brand-bearing: rename together with apple/Packages/UnnamedCore and xtask's CORE_NAME.
[bindings.swift]
module_name = "UnnamedCore"
ffi_module_name = "UnnamedCoreFFI"
ffi_module_filename = "UnnamedCoreFFI"
generate_module_map = false
