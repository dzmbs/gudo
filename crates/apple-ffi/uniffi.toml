# Swift names for the generated bindings (crates/apple-ffi → apple/Packages/GudoCore).
# Brand-bearing: rename together with apple/Packages/GudoCore and xtask's CORE_NAME.
[bindings.swift]
module_name = "GudoCore"
ffi_module_name = "GudoCoreFFI"
ffi_module_filename = "GudoCoreFFI"
generate_module_map = false
