[package]
name = "apple-ffi"
version = "0.0.0"
description = "UniFFI surface over client-core and ssh for the Swift app (GudoCore.xcframework)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The Swift module is `GudoCore` (uniffi.toml); the Rust library name only shows up in
# the static archive's file name, libgudo_core.a.
name = "gudo_core"
crate-type = ["lib", "staticlib"]

[dependencies]
brand.workspace = true
client-core.workspace = true
flate2.workspace = true
push.workspace = true
serde.workspace = true
serde_json.workspace = true
ssh.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
uniffi.workspace = true
zeroize.workspace = true

[dev-dependencies]
daemon.workspace = true
tempfile.workspace = true

[lints]
workspace = true
