[package]
name = "hostd"
version = "0.0.0"
description = "The host daemon binary (thin main over the daemon crate) and the agent hook shim"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Binary names come from crates/brand (DAEMON_BIN, HOOK_BIN); Cargo needs them literally.
[[bin]]
name = "unnamed-hostd"
path = "src/main.rs"

[[bin]]
name = "un-hook"
path = "src/hook.rs"

[dependencies]
anyhow.workspace = true
brand.workspace = true
clap.workspace = true
daemon.workspace = true
proto.workspace = true
libc.workspace = true
qrcode.workspace = true
rustix.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
