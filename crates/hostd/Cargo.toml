[package]
name = "hostd"
version = "0.0.0"
description = "The host daemon binary (thin main over the daemon crate) and the agent hook shim"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Binary names come from crates/brand (DAEMON_BIN, HOOK_BIN); Cargo needs them literally.
[[bin]]
name = "gudo-hostd"
path = "src/main.rs"

[[bin]]
name = "gudo-hook"
path = "src/hook.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
brand.workspace = true
clap.workspace = true
daemon.workspace = true
proto.workspace = true
libc.workspace = true
qrcode.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
agents.workspace = true
client-core.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs", "rt-multi-thread", "macros"] }

[lints]
workspace = true
