# XcodeGen spec. Generate the project with `xcodegen` in apple/ (App.xcodeproj is not committed).
name: App
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Brand.xcconfig
  Release: Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc ("sign to run locally") until there is a team: CODE_SIGN_IDENTITY "-" on each target
    # (target-level, to override XcodeGen's iOS preset).
    CODE_SIGN_STYLE: Manual
    # ghostty-vt.xcframework has no x86_64 simulator slice (Zig's std lacks it); Apple silicon only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  TerminalKit:
    path: Packages/TerminalKit
  PaneLayout:
    path: Packages/PaneLayout
  HostKit:
    path: Packages/HostKit
  GudoCore:
    path: Packages/GudoCore
  DesignSystem:
    path: Packages/DesignSystem
  PushCrypto:
    path: Packages/PushCrypto
  NotifyKit:
    path: Packages/NotifyKit
  DrawingKit:
    path: Packages/DrawingKit
  VoiceKit:
    path: Packages/VoiceKit
  FilesProviderKit:
    path: Packages/FilesProviderKit
  ChatSyntax:
    path: Packages/ChatSyntax
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.7.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  App:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["Excalidraw/**"]
      # The offline Excalidraw bundle (apple/scripts/build-excalidraw.sh), kept as a folder so
      # its fonts/ tree survives; served to the draw overlay over a custom URL scheme.
      - path: App/Resources/Excalidraw
        type: folder
        buildPhase: resources
      # The static Linux daemons "Install helper" uploads (`cargo xtask build-hostd-linux`).
      - path: build/hostd/gudo-hostd-x86_64-linux.gz
        buildPhase: resources
        optional: true
      - path: build/hostd/gudo-hostd-aarch64-linux.gz
        buildPhase: resources
        optional: true
      # What those builds are (build, time, protocol level), to offer "Update Helper".
      - path: build/hostd/hostd-manifest.json
        buildPhase: resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pair
            CFBundleURLSchemes: [$(BRAND_URL_SCHEME)]
        # "Open Tailscale" for hosts on a tailnet (canOpenURL needs the scheme listed).
        LSApplicationQueriesSchemes: [tailscale]
        # Launch on the terminal background so the first frame never flashes white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The editor and dev servers load over local forwards (http://localhost:<port>).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # `http://app.localhost:5173`: dev servers' `*.localhost` names (S-BR1, through the
          # host's proxy); NSAllowsLocalNetworking only covers bare names and IP literals.
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # Shown when a shell or agent in a terminal first reads there (the helper's prompts are
        # attributed to the app).
        NSDesktopFolderUsageDescription: Commands you run in the terminal can use files on your Desktop.
        NSDocumentsFolderUsageDescription: Commands you run in the terminal can use files in your Documents folder.
        NSDownloadsFolderUsageDescription: Commands you run in the terminal can use files in your Downloads folder.
        NSRemovableVolumesUsageDescription: Commands you run in the terminal can use files on removable drives.
        NSNetworkVolumesUsageDescription: Commands you run in the terminal can use files on network drives.
        # Agent runs on the Lock Screen and in the Dynamic Island (AgentActivityWidget).
        NSSupportsLiveActivities: true
        # The daemons' agents Live Activity pushes "needs you" at priority 10 (docs/PUSH.md §6).
        NSSupportsLiveActivitiesFrequentUpdates: true
        # A window's host, tab and pane: Handoff to the owner's other devices, and a tab dragged
        # out into a new iPad window (App/Sources/Windows). Multiple windows (iPad scenes,
        # Stage Manager, external displays) come from the generated scene manifest.
        NSUserActivityTypes: [$(PRODUCT_BUNDLE_IDENTIFIER).terminal]
        # Shared with the Notification Service Extension in push builds (Brand.xcconfig).
        PushKeychainGroup: $(PUSH_KEYCHAIN_GROUP)
        PushAppGroup: $(PUSH_APP_GROUP)
        # Shared with the File Provider extension when FILES_PROVIDER = YES (Brand.xcconfig).
        FilesKeychainGroup: $(FILES_KEYCHAIN_GROUP)
        FilesAppGroup: $(FILES_APP_GROUP)
        FilesSecretsService: $(BRAND_BUNDLE_ID_PREFIX).files
        # Universal links (`https://<domain>/join#…`) and the bundled helper (Brand.xcconfig).
        BrandWebDomain: $(BRAND_WEB_DOMAIN)
        BrandDaemonBinary: $(BRAND_DAEMON_BIN)
        BrandIsDev: $(BRAND_IS_DEV)
        BrandCommandLineTool: $(BRAND_CLI_BIN)
        # The Mac app's updates (Sparkle, AppUpdater): the feed scripts/release-mac.sh writes,
        # and the public half of the EdDSA key it signs each DMG with.
        SUFeedURL: https://$(BRAND_WEB_DOMAIN)/appcast.xml
        SUPublicEDKey: ozc0EMrqWTR2XSAobq9cWWT+7Un0rgp48uiqmyg3QbA=
        SUEnableAutomaticChecks: true
        # `.excalidraw` scenes: drawings dragged, copied and exported out of the app (with a
        # PNG alongside), and dropped or pasted in. Excalidraw declares no UTI; imported, not
        # owned.
        # Session Replay files (`.gudoreplay`, ReplayStore): shared from the app and opened in it.
        ReplayTypeIdentifier: $(BRAND_BUNDLE_ID_PREFIX).gudoreplay
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(BRAND_BUNDLE_ID_PREFIX).gudoreplay
            UTTypeDescription: Session Replay
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [gudoreplay]
              public.mime-type: [application/vnd.gudo.gudoreplay+json]
          # A tab or project dragged in the app (TabDrag); never leaves the process.
          - UTTypeIdentifier: dev.gudo.tab
            UTTypeDescription: Tab
            UTTypeConformsTo: [public.data]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Session Replay
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [$(BRAND_BUNDLE_ID_PREFIX).gudoreplay]
        # Opened files are read where they are (security-scoped, in onOpenURL) and imported.
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.excalidraw.json
            UTTypeDescription: Excalidraw Drawing
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
              public.mime-type: [application/vnd.excalidraw+json]
    settings:
      base:
        PRODUCT_NAME: $(BRAND_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(BRAND_APP_ICON)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_MODULE_NAME: App
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_APP)
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(BRAND_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Pairing QR codes (VisionKit DataScannerViewController).
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a host's pairing QR code.
        # The daemon is reached over the local network too (direct iroh paths, LAN hosts).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your hosts on the local network.
        # Push-to-talk dictation (VoiceKit): on-device speech only.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hear what you dictate into the terminal while you hold the mic key.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn what you dictate into text, on this device only.
        # App Lock, and passwords remembered for terminal prompts (Askpass): both behind Face ID.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock the app, and use passwords you chose to remember for your hosts.
        # ProMotion: lets the terminal's display link run at 120 Hz on iPhone too (iPad needs no key).
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        # The macOS app spawns login shells on local PTYs, which the App Sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        # Notarization needs the hardened runtime (the bundled helper gets it too, below). Its
        # only exception: the microphone, for dictation.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        # Push only with a team (Brand.xcconfig): `#if PUSH_YES` registers with APNs.
        # Files locations only with the shared groups: `#if FILES_PROVIDER_YES`.
        # The helper's LaunchAgent (the "This Mac Helper" phase); iOS bundles none, and Xcode
        # makes every output's folder, so its output there stays out of the bundle.
        HELPER_LAUNCH_AGENT: $(DERIVED_FILE_DIR)/unused-launch-agent.plist
        "HELPER_LAUNCH_AGENT[sdk=macosx*]": $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/$(PRODUCT_BUNDLE_IDENTIFIER).hostd.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PUSH_$(PUSH_ENTITLEMENT) FILES_PROVIDER_$(FILES_PROVIDER)"
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS_FILE)
    # This Mac's own helper (`cargo xtask build-hostd-macos`; a build without it has plain
    # local shells only), signed like the app, and the LaunchAgent SMAppService registers for
    # it: the bundled daemon runs for this user and keeps running after the app quits.
    postBuildScripts:
      - name: This Mac Helper
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/build/hostd/$(BRAND_HELPER_DIRECTORY)/$(BRAND_DAEMON_BIN)
        outputFiles:
          - $(DERIVED_FILE_DIR)/$(BRAND_DAEMON_BIN)
          - $(DERIVED_FILE_DIR)/$(BRAND_DAEMON_BIN).cstemp
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/$(BRAND_DAEMON_BIN)
          - $(HELPER_LAUNCH_AGENT)
        script: |
          [ "$PLATFORM_NAME" = macosx ] || exit 0
          set -e
          src="$SRCROOT/build/hostd/$BRAND_HELPER_DIRECTORY/$BRAND_DAEMON_BIN"
          dst="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/$BRAND_DAEMON_BIN"
          if [ -f "$src" ]; then
            # Signed outside the bundle (the script sandbox lets codesign write only there).
            signed="$DERIVED_FILE_DIR/$BRAND_DAEMON_BIN"
            mkdir -p "$DERIVED_FILE_DIR"
            cp -f "$src" "$signed"
            flags=""
            [ "$ENABLE_HARDENED_RUNTIME" = YES ] && flags="--options runtime"
            # A real identity gets a secure timestamp, which notarization requires.
            identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            [ "$identity" != "-" ] && flags="$flags --timestamp"
            codesign --force --sign "$identity" --identifier "$PRODUCT_BUNDLE_IDENTIFIER.hostd" $flags "$signed"
            cp -f "$signed" "$dst"
          else
            rm -f "$dst"
          fi
          mkdir -p "$(dirname "$HELPER_LAUNCH_AGENT")"
          cat > "$HELPER_LAUNCH_AGENT" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$PRODUCT_BUNDLE_IDENTIFIER.hostd</string>
            <key>BundleProgram</key><string>Contents/MacOS/$BRAND_DAEMON_BIN</string>
            <key>ProgramArguments</key><array><string>$BRAND_DAEMON_BIN</string><string>run</string></array>
            <key>AssociatedBundleIdentifiers</key><array><string>$PRODUCT_BUNDLE_IDENTIFIER</string></array>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>
            <key>ProcessType</key><string>Interactive</string>
          </dict>
          </plist>
          EOF
    dependencies:
      - package: TerminalKit
        product: TerminalCore
      - package: TerminalKit
        product: TerminalRenderer
      - package: TerminalKit
        product: LocalPTY
        destinationFilters: [macOS]
      - package: PaneLayout
        product: PaneLayout
      - package: HostKit
        product: HostKit
      - package: GudoCore
        product: GudoCore
      - package: DesignSystem
        product: DesignSystem
      - package: DrawingKit
        product: DrawingKit
      - package: VoiceKit
        product: VoiceKit
      - package: NotifyKit
        product: NotifyKit
      - package: PushCrypto
        product: PushCrypto
      - package: FilesProviderKit
        product: FilesProviderKit
        destinationFilters: [iOS]
      - package: Markdown
        product: Markdown
      - package: ChatSyntax
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]
      - target: NotificationService
        destinationFilters: [iOS]
      # FilesProvider is embedded only with a paid team (FILES_PROVIDER = YES): its own bundle id
      # needs a provisioning profile and shared groups. Add `- target: FilesProvider` here then.
      - target: AgentActivityWidget
        destinationFilters: [iOS]
  # Opens the daemons' sealed pushes (PushCrypto) and sets title, body, thread and category.
  # Builds and runs without the push entitlement (the payload then keeps the relay's text).
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME) Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PushKeychainGroup: $(PUSH_KEYCHAIN_GROUP)
        PushAppGroup: $(PUSH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.notification-service
        PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_NOTIFICATIONS)
        PRODUCT_NAME: NotificationService
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: $(PUSH_ENTITLEMENTS_FILE)
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: NotifyKit
        product: NotifyKit
  # Paired hosts in the Files app (FilesProviderKit). Built by its own scheme so it stays
  # compiled; the app embeds it only with a paid team (FILES_PROVIDER = YES, Brand.xcconfig).
  FilesProvider:
    type: app-extension
    platform: iOS
    sources: [FilesProvider]
    info:
      path: FilesProvider/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FilesKeychainGroup: $(FILES_KEYCHAIN_GROUP)
        FilesAppGroup: $(FILES_APP_GROUP)
        FilesSecretsService: $(BRAND_BUNDLE_ID_PREFIX).files
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(FILES_APP_GROUP)
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.files
        PRODUCT_NAME: FilesProvider
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: $(FILES_PROVIDER_ENTITLEMENTS_FILE)
    dependencies:
      - package: FilesProviderKit
        product: FilesProviderKit
  # The agent-run Live Activity (Lock Screen, Dynamic Island); updated locally by the app.
  AgentActivityWidget:
    type: app-extension
    platform: iOS
    sources: [AgentActivityWidget]
    info:
      path: AgentActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME) Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BrandURLScheme: $(BRAND_URL_SCHEME)
        # The pushed agents activity opens its sealed rows with the shared key (push builds).
        PushKeychainGroup: $(PUSH_KEYCHAIN_GROUP)
        PushAppGroup: $(PUSH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.agent-activity
        PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_AGENTS)
        PRODUCT_NAME: AgentActivityWidget
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: $(PUSH_ENTITLEMENTS_FILE)
    dependencies:
      - package: NotifyKit
        product: NotifyKit
  AppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [App/Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is named after the brand, not the target.
        "TEST_HOST[sdk=iphonesimulator*]": $(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/$(BRAND_NAME)
        "TEST_HOST[sdk=iphoneos*]": $(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/$(BRAND_NAME)
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/Contents/MacOS/$(BRAND_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: App
  AppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [App/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: App
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: App
schemes:
  FilesProvider:
    build:
      targets:
        FilesProvider: all
  App:
    build:
      targets:
        App: all
    test:
      targets:
        - package: PaneLayout/PaneLayoutTests
        - package: DesignSystem/DesignSystemTests
        - package: DrawingKit/DrawingKitTests
        - package: NotifyKit/NotifyKitTests
        - package: FilesProviderKit/FilesProviderKitTests
        - AppTests
        - AppUITests
    run:
      config: Debug
