# XcodeGen spec. Generate the project with `xcodegen` in apple/ (App.xcodeproj is not committed).
name: App
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Brand.xcconfig
  Release: Brand.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc ("sign to run locally") until there is a team: CODE_SIGN_IDENTITY "-" on each target
    # (target-level, to override XcodeGen's iOS preset).
    CODE_SIGN_STYLE: Manual
    # ghostty-vt.xcframework has no x86_64 simulator slice (Zig's std lacks it); Apple silicon only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  TerminalKit:
    path: Packages/TerminalKit
  PaneLayout:
    path: Packages/PaneLayout
  HostKit:
    path: Packages/HostKit
  UnnamedCore:
    path: Packages/UnnamedCore
  DesignSystem:
    path: Packages/DesignSystem
  PushCrypto:
    path: Packages/PushCrypto
  NotifyKit:
    path: Packages/NotifyKit
  DrawingKit:
    path: Packages/DrawingKit
  VoiceKit:
    path: Packages/VoiceKit
  FilesProviderKit:
    path: Packages/FilesProviderKit
targets:
  App:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["Excalidraw/**"]
      # The offline Excalidraw bundle (apple/scripts/build-excalidraw.sh), kept as a folder so
      # its fonts/ tree survives; served to the draw overlay over a custom URL scheme.
      - path: App/Resources/Excalidraw
        type: folder
        buildPhase: resources
      # The static Linux daemons "Install helper" uploads (`cargo xtask build-hostd-linux`).
      - path: build/hostd/unnamed-hostd-x86_64-linux.gz
        buildPhase: resources
        optional: true
      - path: build/hostd/unnamed-hostd-aarch64-linux.gz
        buildPhase: resources
        optional: true
      # What those builds are (build, time, protocol level), to offer "Update Helper".
      - path: build/hostd/hostd-manifest.json
        buildPhase: resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pair
            CFBundleURLSchemes: [$(BRAND_URL_SCHEME)]
        # "Open Tailscale" for hosts on a tailnet (canOpenURL needs the scheme listed).
        LSApplicationQueriesSchemes: [tailscale]
        # Launch on the terminal background so the first frame never flashes white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The editor and dev servers load over local forwards (http://localhost:<port>).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # `http://app.localhost:5173`: dev servers' `*.localhost` names (S-BR1, through the
          # host's proxy); NSAllowsLocalNetworking only covers bare names and IP literals.
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # Agent runs on the Lock Screen and in the Dynamic Island (AgentActivityWidget).
        NSSupportsLiveActivities: true
        # The daemons' agents Live Activity pushes "needs you" at priority 10 (docs/PUSH.md §6).
        NSSupportsLiveActivitiesFrequentUpdates: true
        # A window's host, tab and pane: Handoff to the owner's other devices, and a tab dragged
        # out into a new iPad window (App/Sources/Windows). Multiple windows (iPad scenes,
        # Stage Manager, external displays) come from the generated scene manifest.
        NSUserActivityTypes: [$(PRODUCT_BUNDLE_IDENTIFIER).terminal]
        # Shared with the Notification Service Extension in push builds (Brand.xcconfig).
        PushKeychainGroup: $(PUSH_KEYCHAIN_GROUP)
        PushAppGroup: $(PUSH_APP_GROUP)
        # Shared with the File Provider extension when FILES_PROVIDER = YES (Brand.xcconfig).
        FilesKeychainGroup: $(FILES_KEYCHAIN_GROUP)
        FilesAppGroup: $(FILES_APP_GROUP)
        FilesSecretsService: $(BRAND_BUNDLE_ID_PREFIX).files
        # `.excalidraw` scenes: drawings dragged, copied and exported out of the app (with a
        # PNG alongside), and dropped or pasted in. Excalidraw declares no UTI; imported, not
        # owned.
        # Session Replay files (`.unreplay`, ReplayStore): shared from the app and opened in it.
        ReplayTypeIdentifier: $(BRAND_BUNDLE_ID_PREFIX).unreplay
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(BRAND_BUNDLE_ID_PREFIX).unreplay
            UTTypeDescription: Session Replay
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [unreplay]
              public.mime-type: [application/vnd.unnamed.unreplay+json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Session Replay
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [$(BRAND_BUNDLE_ID_PREFIX).unreplay]
        # Opened files are read where they are (security-scoped, in onOpenURL) and imported.
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.excalidraw.json
            UTTypeDescription: Excalidraw Drawing
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
              public.mime-type: [application/vnd.excalidraw+json]
    settings:
      base:
        PRODUCT_NAME: $(BRAND_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_MODULE_NAME: App
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(BRAND_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Pairing QR codes (VisionKit DataScannerViewController).
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a host's pairing QR code.
        # The daemon is reached over the local network too (direct iroh paths, LAN hosts).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your hosts on the local network.
        # Push-to-talk dictation (VoiceKit): on-device speech only.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hear what you dictate into the terminal while you hold the mic key.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn what you dictate into text, on this device only.
        # Passwords remembered for terminal prompts (Askpass): read only after Face ID.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Use a password you chose to remember for a host's terminal prompt.
        # ProMotion: lets the terminal's display link run at 120 Hz on iPhone too (iPad needs no key).
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        # The macOS app spawns login shells on local PTYs, which the App Sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Push only with a team (Brand.xcconfig): `#if PUSH_YES` registers with APNs.
        # Files locations only with the shared groups: `#if FILES_PROVIDER_YES`.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PUSH_$(PUSH_ENTITLEMENT) FILES_PROVIDER_$(FILES_PROVIDER)"
        CODE_SIGN_ENTITLEMENTS: $(PUSH_ENTITLEMENTS_FILE)
    dependencies:
      - package: TerminalKit
        product: TerminalCore
      - package: TerminalKit
        product: TerminalRenderer
      - package: TerminalKit
        product: LocalPTY
        destinationFilters: [macOS]
      - package: PaneLayout
        product: PaneLayout
      - package: HostKit
        product: HostKit
      - package: UnnamedCore
        product: UnnamedCore
      - package: DesignSystem
        product: DesignSystem
      - package: DrawingKit
        product: DrawingKit
      - package: VoiceKit
        product: VoiceKit
      - package: NotifyKit
        product: NotifyKit
      - package: PushCrypto
        product: PushCrypto
      - package: FilesProviderKit
        product: FilesProviderKit
        destinationFilters: [iOS]
      - target: NotificationService
        destinationFilters: [iOS]
      - target: FilesProvider
        destinationFilters: [iOS]
      - target: AgentActivityWidget
        destinationFilters: [iOS]
  # Opens the daemons' sealed pushes (PushCrypto) and sets title, body, thread and category.
  # Builds and runs without the push entitlement (the payload then keeps the relay's text).
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME) Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PushKeychainGroup: $(PUSH_KEYCHAIN_GROUP)
        PushAppGroup: $(PUSH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.notification-service
        PRODUCT_NAME: NotificationService
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: $(PUSH_ENTITLEMENTS_FILE)
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: NotifyKit
        product: NotifyKit
  # Paired hosts in the Files app (FilesProviderKit). Built always so it stays compiled and
  # tested; it only runs where the app adds its domains, which needs the shared groups
  # (FILES_PROVIDER = YES with a paid team, Brand.xcconfig).
  FilesProvider:
    type: app-extension
    platform: iOS
    sources: [FilesProvider]
    info:
      path: FilesProvider/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FilesKeychainGroup: $(FILES_KEYCHAIN_GROUP)
        FilesAppGroup: $(FILES_APP_GROUP)
        FilesSecretsService: $(BRAND_BUNDLE_ID_PREFIX).files
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: $(FILES_APP_GROUP)
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.files
        PRODUCT_NAME: FilesProvider
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: $(FILES_PROVIDER_ENTITLEMENTS_FILE)
    dependencies:
      - package: FilesProviderKit
        product: FilesProviderKit
  # The agent-run Live Activity (Lock Screen, Dynamic Island); updated locally by the app.
  AgentActivityWidget:
    type: app-extension
    platform: iOS
    sources: [AgentActivityWidget]
    info:
      path: AgentActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: $(BRAND_NAME) Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BrandURLScheme: $(BRAND_URL_SCHEME)
        # The pushed agents activity opens its sealed rows with the shared key (push builds).
        PushKeychainGroup: $(PUSH_KEYCHAIN_GROUP)
        PushAppGroup: $(PUSH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.agent-activity
        PRODUCT_NAME: AgentActivityWidget
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: $(PUSH_ENTITLEMENTS_FILE)
    dependencies:
      - package: NotifyKit
        product: NotifyKit
  AppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [App/Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is named after the brand, not the target.
        "TEST_HOST[sdk=iphonesimulator*]": $(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/$(BRAND_NAME)
        "TEST_HOST[sdk=iphoneos*]": $(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/$(BRAND_NAME)
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/$(BRAND_NAME).app/Contents/MacOS/$(BRAND_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: App
  AppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [App/UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAND_BUNDLE_ID_PREFIX).app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: App
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: App
schemes:
  App:
    build:
      targets:
        App: all
    test:
      targets:
        - package: PaneLayout/PaneLayoutTests
        - package: DesignSystem/DesignSystemTests
        - package: DrawingKit/DrawingKitTests
        - package: NotifyKit/NotifyKitTests
        - package: FilesProviderKit/FilesProviderKitTests
        - AppTests
        - AppUITests
    run:
      config: Debug
