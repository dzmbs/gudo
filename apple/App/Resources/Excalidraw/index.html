<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Offline: everything comes from the app bundle (custom scheme); no network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:">
<title>Canvas</title>
<link rel="stylesheet" href="canvas.css">
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* Canvas: a band at the top for the host's glass controls, so they never cover the editor's tools. */
  body[data-mode="canvas"] #root { box-sizing: border-box; padding-top: 56px; }
  body { -webkit-user-select: none; -webkit-touch-callout: none; }
  /* Overlay: the terminal shows through; the host draws Done / Cancel / Send. */
  body[data-mode="overlay"] .excalidraw,
  body[data-mode="overlay"] .excalidraw .excalidraw-container,
  body[data-mode="canvas"] .excalidraw,
  body[data-mode="canvas"] .excalidraw .excalidraw-container { background: transparent !important; }
  body[data-mode="overlay"] .main-menu-trigger,
  body[data-mode="overlay"] .help-icon,
  body[data-mode="overlay"] .default-sidebar-trigger,
  body[data-mode="overlay"] .sidebar-trigger,
  body[data-mode="overlay"] .zoom-actions,
  body[data-mode="overlay"] .welcome-screen-center,
  body[data-mode="overlay"] .welcome-screen-decor,
  body[data-mode="overlay"] .HintViewer,
  body[data-mode="canvas"] .default-sidebar-trigger,
  body[data-mode="canvas"] .sidebar-trigger,
  body .excalidraw .help-icon,
  body .excalidraw .welcome-screen-decor { display: none !important; }
  /* Overlay: none of Excalidraw's own chrome, which would cover the first terminal rows;
     the host's glass toolbar at the bottom of the pane carries the tools (apple/README "Drawing"). */
  body[data-mode="overlay"] .layer-ui__wrapper,
  body[data-mode="overlay"] .App-menu_top,
  body[data-mode="overlay"] .App-toolbar,
  body[data-mode="overlay"] .App-toolbar-container,
  body[data-mode="overlay"] .App-mobile-menu,
  body[data-mode="overlay"] .App-bottom-bar,
  body[data-mode="overlay"] .mobile-misc-tools-container,
  body[data-mode="overlay"] .layer-ui__wrapper__footer,
  body[data-mode="overlay"] .Toast,
  body[data-mode="overlay"] .scroll-back-to-content { display: none !important; }
  /* Its context menu, when it shows, in the app's quiet monochrome. */
  body[data-mode="overlay"] .context-menu {
    font: 13px -apple-system, system-ui, sans-serif !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28) !important;
  }
  body[data-mode="overlay"] .context-menu-item:hover { background: rgba(127, 127, 127, 0.16) !important; }
</style>
<script src="boot.js"></script>
</head>
<body data-mode="overlay" data-theme="dark">
<div id="root"></div>
<script src="canvas.js"></script>
</body>
</html>
